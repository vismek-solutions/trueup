name: build

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

      # pnpm run check is the gate, so this one only has to produce the file
      - name: Write the architecture report for code scanning
        if: always()
        continue-on-error: true
        run: node ./packages/trueup/bin/trueup.js --github > trueup.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trueup.sarif

      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm run build

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: package
          path: packages/trueup/dist
          retention-days: 1

  stage:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      # trusted publishing needs npm 11.5.1 or newer, which every current 24.x ships
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: packages/trueup/dist

      # publishing skips lifecycle scripts, so prepack does not run and cannot carry it
      - name: Carry the readme into the package
        run: cp README.md packages/trueup/README.md

      - name: Refuse a tag that does not match the version it claims
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/trueup
        run: |
          declared=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match version ${declared} in package.json"
            exit 1
          fi

      - name: Number the dev build
        if: github.ref == 'refs/heads/main'
        working-directory: packages/trueup
        run: |
          declared=$(node -p "require('./package.json').version")
          npm pkg set version="${declared}-dev.${{ github.run_number }}"

      # nothing reaches the registry until someone runs `npm stage approve <stage-id>`
      - name: Stage for publishing
        run: npm stage publish ./packages/trueup --ignore-scripts --tag ${{ startsWith(github.ref, 'refs/tags/') && 'latest' || 'dev' }}
